name: web

on:
  push:
    branches: [main]
    paths:
      [
        "apps/web/**",
        "firebase.json",
        "Makefile",
        "scripts/**",
        ".github/workflows/web.yml",
      ]
  pull_request:
    paths:
      [
        "apps/web/**",
        "firebase.json",
        "Makefile",
        "scripts/**",
        ".github/workflows/web.yml",
      ]

permissions:
  contents: read

# One run per branch at a time, in push order, so an older run can never deploy after a newer
# one. On main the newest waiting run replaces older waiting ones; PRs cancel stale runs.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The same gate as local `make verify`, so the two cannot drift.
      - run: make verify
        working-directory: .
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-logs
          path: apps/web/tmp/verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist/web/browser

  deploy:
    needs: gate
    # Skipped until the one-time GCP setup sets the repository variables.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist/web/browser
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
      - run: npx -y firebase-tools@15.36.0 deploy --only hosting --project "$PROJECT_ID" --non-interactive
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
